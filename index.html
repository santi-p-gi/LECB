<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Leé tus libros EPUB y PDF como en papel, en el celular o la compu: subrayá, buscá y escuchalos en voz alta. Gratis, sin cuenta y tus libros no salen de tu dispositivo." />
    <link rel="canonical" href="https://lecb.ar/" />
    <!-- Vista previa al compartir el enlace (WhatsApp, Facebook, X, LinkedIn, Telegram…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LECB" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:url" content="https://lecb.ar/" />
    <meta property="og:title" content="LECB — Tus libros, como en papel" />
    <meta property="og:description" content="Leé tus EPUB y PDF en el celular o la compu: subrayá, buscá y escuchalos en voz alta. Gratis, sin cuenta y tus libros no salen de tu dispositivo." />
    <meta property="og:image" content="https://lecb.ar/vista-previa.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="LECB: un libro abierto con texto subrayado, y el lema «Tus libros, como en papel»" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- App instalable (PWA): el manifiesto describe la app; lo demás es para iPhone, que no lo lee completo -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#9b3b2a" />
    <link rel="apple-touch-icon" href="/iconos/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="LECB" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Inter:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400..600;1,7..72,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <title>LECB — Lector de libros EPUB y PDF</title>
    <!-- Para Google: qué es LECB (aplicación web gratuita) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "LECB",
        "url": "https://lecb.ar/",
        "description": "Lector de libros EPUB y PDF en el navegador: subrayados, notas, búsqueda y lectura en voz alta. Los libros quedan solo en el dispositivo.",
        "applicationCategory": "BookApplication",
        "operatingSystem": "Cualquiera (navegador web)",
        "inLanguage": "es",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "ARS" }
      }
    </script>
    <!-- Estadísticas anónimas (GoatCounter): sin cookies; no cuenta las visitas desde localhost -->
    <script data-goatcounter="https://lecb.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
